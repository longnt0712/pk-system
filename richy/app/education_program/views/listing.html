<style>
    .education-school-toolbar, .education-school-switch, .education-school-options {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
    }
    .education-school-toolbar { margin: 10px 0 14px; gap: 12px; }
    .education-school-switch {
        max-width: 100%;
        padding: 5px;
        border: 1px solid rgba(110, 110, 160, .22);
        border-radius: 16px;
        background: rgba(110, 110, 160, .08);
    }
    .education-school-label {
        padding: 0 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .06em;
        text-transform: uppercase;
    }
    .education-school-options { gap: 4px; }
    .education-school-option {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        max-width: 100%;
        min-height: 38px;
        padding: 6px 12px;
        border: 1px solid transparent;
        border-radius: 11px;
        background: transparent;
        color: inherit;
        text-align: left;
        font-weight: 700;
    }
    .education-school-option:hover:not(:disabled) { border-color: currentColor; }
    .education-school-option.is-selected {
        background: linear-gradient(125deg, #4d55cc, #7044c5);
        color: #fff;
        box-shadow: 0 3px 8px rgba(75, 62, 163, .22);
    }
    .education-school-option:focus-visible { outline: 2px solid #7466e8; outline-offset: 2px; }
    .education-school-option:disabled { opacity: .65; cursor: wait; }
    .education-school-id {
        padding: 1px 6px;
        border-radius: 10px;
        background: rgba(110, 110, 160, .14);
        font-size: 11px;
        white-space: nowrap;
    }
    .education-school-option.is-selected .education-school-id { background: rgba(255, 255, 255, .20); }
</style>
<!-- END PAGE HEADER-->
<!-- BEGIN MAIN CONTENT -->
<div class="row margin-top-10">
    <div class="col-md-12">
    
        <div class="portlet light bordered">
            <div class="portlet-body">
                <div class="education-school-toolbar">
                    <div class="education-school-switch" ng-if="vm.schools.length" role="group" aria-labelledby="education-school-label">
                        <span id="education-school-label" class="education-school-label"><i class="fa fa-university" aria-hidden="true"></i> School</span>
                        <div class="education-school-options">
                            <button type="button" class="education-school-option" ng-repeat="school in vm.schools track by school.id"
                                    ng-class="{'is-selected': vm.schoolId === school.id}" ng-attr-aria-pressed="{{vm.schoolId === school.id}}"
                                    ng-disabled="vm.mainSaving" ng-click="vm.selectSchool(school.id)">
                                <span ng-bind="school.name"></span>
                                <span class="education-school-id" ng-bind="'#' + school.id"></span>
                            </button>
                        </div>
                    </div>
                    <button class="btn btn-default" ng-if="vm.canSetMain()" data-ng-click="vm.newObject()"><i class="fa fa-plus-circle"></i> Thêm mới</button>
                </div>
                <table id="bsTableControl" bs-table-control="vm.bsTableControl"></table>
                <p class="text-muted" style="margin-top:12px">Mỗi School có một chương trình <strong>Main</strong> dùng mặc định cho bảng điểm và thiết lập đầu điểm.</p>
            </div>
        </div>
    </div>
</div>

<!-- END MAIN CONTENT -->
<!-- BEGIN MAIN JS-->
<script type="text/ng-template" id="edit_object_modal.html">
    <div modal-movable>
        <div class="modal-header">
            <button type="button" class="close" ng-click="$dismiss()" aria-hidden="true"></button>
            <h4 class="modal-title" data-ng-if="vm.educationProgram.isNew == true"><i class="icon-plus"></i>Thêm chương trình đào tạo</h4>
            <h4 class="modal-title" data-ng-if="vm.educationProgram.isNew == false"><i class="fa fa-pencil-square-o"></i>Cập nhật chương trình đào tạo</h4>
        </div>
        <div class="modal-body">
            <div class="row">
                <div class="col-md-12">
                    <label class="bold">Tên</label>
                    <input data-ng-model="vm.educationProgram.name" type="text" autofocus="autofocus" class="form-control" />
                </div>
                <div class="col-md-12">
                    <label class="bold">Mã</label>
                    <input data-ng-model="vm.educationProgram.code" type="text" autofocus="autofocus" class="form-control" />
                </div>
                <div class="col-md-12">
                    <label for="program-school">School ID</label>
                    <select id="program-school" class="form-control" ng-model="vm.educationProgram.schoolId" ng-disabled="!$settings.isAdmin"
                            ng-options="school.id as (school.name + ' (#' + school.id + ')') for school in vm.schools"></select>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" ng-click="$dismiss()" class="btn btn-default" data-dismiss="modal">Hủy bỏ</button>
            <button type="button" ng-click="$close('yes');" ng-disabled="!vm.educationProgram.schoolId" class="btn btn-primary" data-dismiss="modal">Lưu</button>
        </div>
    </div>
</script>

<script type="text/ng-template" id="confirm_delete_modal.html">
    <div modal-movable>
        <div class="modal-header">
            <button type="button" class="close" ng-click="$dismiss()" aria-hidden="true"></button>
            <h4 class="modal-title"><i class="icon-question"></i>Xóa</h4>
        </div>
        <div class="modal-body">
            <p>Bạn có chắc chắn muốn xóa bản ghi đã chọn không?</p>
        </div>
        <div class="modal-footer">
            <button type="button" ng-click="$dismiss()" class="btn btn-default" data-dismiss="modal">Không</button>
            <button type="button" ng-click="$close('yes')" class="btn btn-primary" data-dismiss="modal">Có</button>
        </div>
    </div>
</script>

<script type="text/ng-template" id="import_modal.html">
    <div modal-movable>
        <div class="modal-header">
            <button type="button" class="close" ng-click="$dismiss()" aria-hidden="true"></button>
            <h4 class="modal-title bold font-yellow-gold"><i class="fa fa-cloud-upload"></i> Thêm môn học vào chương trình đào tạo</h4>
        </div>
        <div class="modal-body">
            <div class="box-body box-profile">
                <div class="box-body">
                    <div class="row">
                        <div class="col-md-12">
                            <a class="dash-box display-block link" ngf-select="uploadFiles($file, $invalidFiles)"
                               accept="/*" ngf-max-size="{{MAX_FILE_SIZE}}"><i class="fa fa-cloud-upload"></i> Chọn tệp tin để tải lên</a>
                        </div>

                        <div class="col-md-12 margin-top-20" ng-if="f != null">
                            Tải tệp tin: {{f.name}}
                        </div>

                        <div class="col-md-12 margin-top-20" ng-if="errFile != null && errFile.$error != ''">
                            Có lỗi: <span ng-if="errFile.$error == 'maxSize'">Kích thước tệp tin phải nhỏ hơn {{errFile.$errorParam}}</span>
                            <span ng-if="errFile.$error != null && errFile.$error != 'maxSize'">Tệp tin {{errFile.name}} có lỗi. Xin mời chọn tệp tin khác.</span>
                        </div>

                        <div class="col-md-12 margin-top-20" ng-if="f.progress >= 0">
                            <div class="progress">
                                <div class="progress-bar" role="progressbar" aria-valuenow="70" aria-valuemin="0" aria-valuemax="100" ng-bind="f.progress + '%'" style="width:{{f.progress}}%">
                                    {{f.progress}}%
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" ng-click="$dismiss()" class="btn btn-default" data-dismiss="modal">Hủy</button>
            <button type="button" ng-click="$close('yes')" class="btn btn-primary" data-dismiss="modal">Tải lên</button>
        </div>
    </div>
</script>
<!-- BEGIN MAIN JS -->
