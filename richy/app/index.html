        <!-- =====================================================
             GLOBAL DARK MODE V9 - ROBUST GLOBAL RUNTIME
             - Runs before first paint
             - Persists across routes/reload/login
             - Safe if loaded more than once
             ===================================================== -->
        <script>
            (function (window, document) {
                'use strict';

                var STORAGE_KEY = 'ieltsroom.globalDarkMode';

                function readStoredTheme() {
                    try {
                        return window.localStorage.getItem(STORAGE_KEY) === 'true';
                    } catch (e) {
                        return false;
                    }
                }

                function applyTheme(enabled) {
                    enabled = enabled === true;

                    var root = document.documentElement;

                    if (root) {
                        if (enabled) {
                            root.classList.add('global-dark-mode');
                        } else {
                            root.classList.remove('global-dark-mode');
                        }
                    }

                    if (document.body) {
                        if (enabled) {
                            document.body.classList.add('global-dark-mode');
                        } else {
                            document.body.classList.remove('global-dark-mode');
                        }
                    }

                    return enabled;
                }

                function saveTheme(enabled) {
                    try {
                        window.localStorage.setItem(
                            STORAGE_KEY,
                            enabled ? 'true' : 'false'
                        );
                    } catch (e) {
                        /* localStorage blocked - theme still works this session */
                    }
                }

                /*
                 * One global object instead of several loose functions.
                 * Header can always call this object when available.
                 */
                window.IeltsRoomTheme = window.IeltsRoomTheme || {};

                window.IeltsRoomTheme.get = function () {
                    return readStoredTheme();
                };

                window.IeltsRoomTheme.apply = function (enabled) {
                    return applyTheme(enabled);
                };

                window.IeltsRoomTheme.set = function (enabled) {
                    enabled = enabled === true;

                    saveTheme(enabled);
                    applyTheme(enabled);

                    return enabled;
                };

                window.IeltsRoomTheme.toggle = function () {
                    var enabled =
                        !document.documentElement.classList.contains(
                            'global-dark-mode'
                        );

                    return window.IeltsRoomTheme.set(enabled);
                };

                /*
                 * Backward-compatible aliases.
                 * Old header versions can still call these functions.
                 */
                window.getGlobalDarkMode = function () {
                    return window.IeltsRoomTheme.get();
                };

                window.setGlobalDarkMode = function (enabled) {
                    return window.IeltsRoomTheme.set(enabled);
                };

                window.toggleGlobalDarkMode = function () {
                    return window.IeltsRoomTheme.toggle();
                };

                /* Apply immediately to prevent a white flash. */
                applyTheme(readStoredTheme());

                document.addEventListener(
                    'DOMContentLoaded',
                    function () {
                        applyTheme(readStoredTheme());
                    }
                );

                window.addEventListener(
                    'storage',
                    function (event) {
                        if (event.key === STORAGE_KEY) {
                            applyTheme(event.newValue === 'true');
                        }
                    }
                );

            })(window, document);
        </script>

        <!--
            APP ASSET VERSION
            Mỗi lần deploy frontend, chỉ cần tăng giá trị APP_VERSION bên dưới.
            Các CSS/JS nội bộ dùng helper sẽ tự nhận ?v=APP_VERSION để trình
            duyệt tải bản mới. Không gắn version vào thư viện external để tránh
            tải lại các file lớn không thay đổi.
        -->
        <script>
            (function (window, document) {
                'use strict';

                window.APP_VERSION = '20260906-05';

                function versionedUrl(url) {
                    var separator = url.indexOf('?') >= 0 ? '&' : '?';

                    return url + separator + 'v=' +
                        encodeURIComponent(window.APP_VERSION);
                }

                window.writeVersionedStylesheet = function (href) {
                    document.write(
                        '<link href="' + versionedUrl(href) +
                        '" rel="stylesheet" type="text/css" />'
                    );
                };

                window.writeVersionedScript = function (src) {
                    document.write(
                        '<script src="' + versionedUrl(src) +
                        '" type="text/javascript"><\/script>'
                    );
                };
            })(window, document);
        </script>
