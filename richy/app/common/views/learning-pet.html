<aside class="learning-pet-shell"
       ng-if="pet.visible"
       ng-style="pet.shellStyle"
       ng-class="{'is-open': pet.panelOpen, 'is-minimized': pet.minimized, 'is-dragging': pet.dragging, 'is-panel-below': pet.panelBelow, 'is-panel-left': pet.panelAlignLeft}"
       aria-live="polite">
    <section class="learning-pet-panel" ng-if="pet.panelOpen && !pet.minimized">
        <header class="learning-pet-panel-header">
            <div>
                <span class="learning-pet-kicker">MẦM HỌC NHẮC BẠN</span>
                <h3>{{pet.summaryTitle}}</h3>
            </div>
            <button type="button" class="learning-pet-icon-button" ng-click="pet.closePanel($event)" aria-label="Đóng thông báo"><i class="fa fa-times"></i></button>
        </header>
        <div class="learning-pet-loading" ng-if="pet.loading"><i class="fa fa-spinner fa-spin"></i> Đang kiểm tra tiến độ học tập...</div>
        <div class="learning-pet-error" ng-if="!pet.loading && pet.error"><strong>Chưa tải được thông tin.</strong><button type="button" ng-click="pet.refresh()">Thử lại</button></div>
        <div ng-if="!pet.loading && !pet.error">
            <section class="learning-pet-collection" ng-if="pet.availablePets.length">
                <button type="button" class="learning-pet-picker-button"
                        ng-click="pet.openPetPicker($event)" aria-haspopup="dialog">
                    <span class="learning-pet-choice-image">
                        <img ng-src="{{pet.selectedPet().image}}" alt="" aria-hidden="true"
                             ng-class="{'is-cartoon-pet': pet.selectedPetKey === 'CUTE_TOM_CAT' || pet.selectedPetKey === 'CUTE_JERRY_MOUSE' || pet.selectedPetKey === 'CUTE_TUFFY_MOUSE' || pet.selectedPetKey === 'CUTE_PIKACHU'}">
                    </span>
                    <span class="learning-pet-picker-copy">
                        <strong>Chọn pet</strong>
                        <small>Đang dùng: {{pet.selectedPet().name}}</small>
                    </span>
                    <i class="fa fa-chevron-right" aria-hidden="true"></i>
                </button>
            </section>
            <div class="learning-pet-stats">
                <button type="button" ng-click="pet.selectSection('tasks')" ng-class="{'is-active': pet.activeSection === 'tasks'}"><strong>{{pet.pendingTaskCount}}</strong><span>Bài cần làm</span></button>
                <button type="button" ng-click="pet.selectSection('drafts')" ng-class="{'is-active': pet.activeSection === 'drafts'}"><strong>{{pet.drafts.length}}</strong><span>Đang làm dở</span></button>
            </div>
            <div class="learning-pet-list" ng-if="pet.activeSection === 'tasks' && pet.tasks.length">
                <button type="button" class="learning-pet-list-item" ng-repeat="task in pet.tasks | limitTo:5 track by task.taskId" ng-click="pet.openTask(task)">
                    <span class="learning-pet-list-icon"><i class="fa" ng-class="pet.taskIcon(task)"></i></span>
                    <span class="learning-pet-list-copy"><strong>{{task.title || pet.taskTypeLabel(task)}}</strong><small>{{pet.taskTypeLabel(task)}}<span ng-if="task.ieltsPart"> · Part {{task.ieltsPart}}</span></small><small ng-if="task.dueDate">Hạn {{task.dueDate | date:'dd/MM/yyyy'}}{{task.dueTime ? ' ' + task.dueTime : ''}}</small></span>
                    <i class="fa fa-chevron-right"></i>
                </button>
            </div>
            <div class="learning-pet-list" ng-if="pet.activeSection === 'drafts' && pet.drafts.length">
                <button type="button" class="learning-pet-list-item" ng-repeat="draft in pet.drafts | limitTo:5 track by draft.storageKey" ng-click="pet.resumeDraft(draft)">
                    <span class="learning-pet-list-icon"><i class="fa" ng-class="pet.draftIcon(draft)"></i></span>
                    <span class="learning-pet-list-copy"><strong>{{draft.title}}</strong><small>{{draft.typeLabel}}<span ng-if="draft.assignmentPart"> · Part {{draft.assignmentPart}}</span><span ng-if="draft.sourceLabel"> · {{draft.sourceLabel}}</span></small><small ng-if="draft.progressValue">{{draft.progressLabel}} {{draft.progressValue}}</small></span>
                    <i class="fa fa-play"></i>
                </button>
            </div>
            <div class="learning-pet-empty" ng-if="pet.activeSection === 'tasks' && !pet.tasks.length"><i class="fa fa-check-circle"></i><strong>Không có bài lớp giao nào đang chờ hoàn thành.</strong></div>
            <div class="learning-pet-empty" ng-if="pet.activeSection === 'drafts' && !pet.drafts.length"><i class="fa fa-bookmark-o"></i><strong>Không có bài nào đang làm dở.</strong></div>
        </div>
        <footer class="learning-pet-panel-footer">
            <button type="button" ng-click="pet.refresh()" ng-disabled="pet.loading"><i class="fa fa-refresh" ng-class="{'fa-spin': pet.loading}"></i> Cập nhật</button>
            <button type="button" ng-click="pet.muteForSession()"><i class="fa fa-volume-off"></i> Ẩn trong phiên này</button>
        </footer>
    </section>
    <button type="button" class="learning-pet-message" ng-if="!pet.panelOpen && !pet.minimized && pet.message" ng-click="pet.openPanel($event)">{{pet.message}}</button>
    <div class="learning-pet-stage">
        <button type="button" class="learning-pet-character" ng-click="pet.togglePanel($event)" ng-attr-aria-grabbed="{{pet.dragging}}" ng-attr-aria-label="{{pet.panelOpen ? 'Đóng trợ lý Mầm Học' : 'Mở hoặc kéo trợ lý Mầm Học'}}">
            <span class="learning-pet-sprite" ng-if="pet.petForm === 'hatched' && pet.spriteReady" ng-style="pet.spriteStyle"></span>
            <img class="learning-pet-hatched-fallback" ng-if="pet.petForm === 'hatched' && !pet.spriteReady"
                 ng-src="{{pet.hatchedFallbackImage}}" draggable="false" alt="" aria-hidden="true" />
            <img class="learning-pet-egg"
                 ng-class="{
                    'is-capybara-pet': pet.petForm === 'capybara-hatched',
                    'is-cute-dog-pet': pet.petForm === 'cute-dog-hatched',
                    'is-cute-tom-cat-pet': pet.petForm === 'cute-tom-cat-hatched',
                    'is-jerry-mouse-pet': pet.petForm === 'jerry-mouse-hatched',
                    'is-tuffy-mouse-pet': pet.petForm === 'tuffy-mouse-hatched',
                    'is-pikachu-pet': pet.petForm === 'pikachu-hatched',
                    'is-cartoon-pet': pet.selectedPetKey === 'CUTE_TOM_CAT' || pet.selectedPetKey === 'CUTE_JERRY_MOUSE' || pet.selectedPetKey === 'CUTE_TUFFY_MOUSE' || pet.selectedPetKey === 'CUTE_PIKACHU'
                 }"
                 ng-if="pet.petForm !== 'hatched' && pet.petForm !== 'pikachu-hatched'" ng-src="{{pet.petImage}}" draggable="false" alt="" aria-hidden="true" />
            <span class="learning-pet-pikachu" ng-if="pet.petForm === 'pikachu-hatched'" aria-hidden="true">
                <svg class="learning-pet-pikachu__electricity" viewBox="0 0 120 124" focusable="false" aria-hidden="true">
                    <path class="learning-pet-pikachu__ring" d="M61 7 72 11 77 8 84 19 94 18 97 31 108 34 105 47 115 56 108 68 113 78 101 85 100 98 86 100 81 113 67 109 57 118 45 110 33 112 29 100 16 96 18 81 7 76 14 62 6 51 14 40 10 28 24 24 27 12 41 14 48 5Z" />
                    <g class="learning-pet-pikachu__sparks">
                        <path d="M19 31 12 41 22 40 15 53M97 30 106 40 96 42 106 53M18 80 10 89 22 89 17 100M99 77 109 86 99 89 105 99" />
                        <path class="learning-pet-pikachu__spark-core" d="m42 11 5 7-8 3m37 82 8 2-5 8" />
                    </g>
                </svg>
                <svg class="learning-pet-pikachu__shoulder" viewBox="0 0 1024 1024" focusable="false" aria-hidden="true">
                    <path d="M600 546Q654 540 714 549L712 588 600 606Z" fill="#ffe000" />
                    <path d="M600 546Q654 540 714 549" fill="none" stroke="#10100c" stroke-width="8" stroke-linecap="round" />
                    <path d="M493 571Q528 565 549 551Q553 592 540 627L520 684 490 687Z" fill="#ffe000" />
                    <path d="M549 551Q553 592 540 627L520 684" fill="none" stroke="#10100c" stroke-width="8" stroke-linecap="round" />
                </svg>
                <img class="learning-pet-pikachu__body" ng-src="{{pet.petImage}}" draggable="false" alt="" />
                <span class="learning-pet-pikachu__arm">
                    <img ng-src="{{pet.petImage}}" draggable="false" alt="" />
                </span>
            </span>
            <span class="learning-pet-badge" ng-if="pet.notificationCount > 0">{{pet.notificationCount > 99 ? '99+' : pet.notificationCount}}</span>
        </button>
        <button type="button" class="learning-pet-minimize" ng-click="pet.toggleMinimized($event)" ng-attr-aria-label="{{pet.minimized ? 'Hiện Mầm Học' : 'Thu nhỏ Mầm Học'}}"><i class="fa" ng-class="pet.minimized ? 'fa-commenting' : 'fa-minus'"></i></button>
    </div>
</aside>
