<div class="row margin-top-10">
    <div class="col-md-12">
        <div class="portlet light bordered">
            <div class="portlet-title">
                <div class="caption"><i class="fa fa-sitemap"></i> Cây lớp học và đội</div>
            </div>
            <div class="portlet-body">
                <div class="class-tree-toolbar">
                    <button class="btn btn-primary" data-ng-if="vm.canCreateRootClass()"
                            data-ng-click="vm.openEditor(null, null)">
                        <i class="fa fa-plus-circle"></i> Thêm lớp gốc
                    </button>
                    <input class="form-control" data-ng-model="vm.searchText"
                           data-ng-change="vm.rebuildTree()" placeholder="Tìm theo tên hoặc mã lớp..." />
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered table-hover class-tree-table">
                        <thead>
                        <tr>
                            <th class="class-name-column">LỚP / TỔ / ĐỘI</th>
                            <th class="class-responsible-column">NGƯỜI PHỤ TRÁCH</th>
                            <th class="class-actions-column">THAO TÁC</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr data-ng-repeat="row in vm.visibleClasses track by row.id"
                            data-ng-class="{'class-tree-child-row': row.level > 0}">
                            <td>
                                <div class="tree-name" data-ng-class="{'root-class': row.level === 0}">
                                    <span class="tree-indent-step" data-ng-class="{'tree-indent-last': $last}" aria-hidden="true"
                                          data-ng-repeat="depth in row.levelMarkers track by $index"></span>
                                    <button type="button" class="btn btn-default tree-toggle"
                                            data-ng-if="row.hasChildren" data-ng-click="vm.toggle(row)"
                                            data-ng-attr-aria-expanded="{{vm.expanded[row.id] === true}}"
                                            data-ng-attr-title="{{vm.expanded[row.id] ? 'Thu gọn đội' : 'Mở đội'}}">
                                        <i class="fa" data-ng-class="vm.expanded[row.id] ? 'fa-chevron-down' : 'fa-chevron-right'"></i>
                                    </button>
                                    <span class="tree-spacer" data-ng-if="!row.hasChildren"></span>
                                    <i class="fa" data-ng-class="row.level === 0 ? 'fa-folder-open' : 'fa-users'"></i>&nbsp;
                                    <button type="button" class="class-team-link" data-ng-if="row.canManageTeams"
                                            data-ng-click="vm.openTeamBoard(row)" title="Mở danh sách học sinh để phân đội">
                                        {{row.name}}
                                    </button>
                                    <span data-ng-if="!row.canManageTeams">{{row.name}}</span>
                                    <span class="badge badge-info child-badge" data-ng-if="row.childCount">{{row.childCount}}</span>
                                </div>
                            </td>
                            <td class="class-tree-responsible">
                                <div data-ng-if="row.primaryTeacherId">
                                    <strong>{{row.parentId ? 'Đội trưởng' : 'Phụ trách chính'}}:</strong>
                                    {{vm.teacherNames(row, true)}}
                                </div>
                                <div data-ng-if="vm.teacherNames(row, false)">
                                    <strong>{{row.parentId ? 'Đội phó' : 'Phụ trách phụ'}}:</strong>
                                    {{vm.teacherNames(row, false)}}
                                </div>
                                <span class="class-teacher-empty" data-ng-if="!row.teachers.length">Chưa gán</span>
                            </td>
                            <td class="class-tree-actions">
                                <button class="btn btn-xs btn-warning" data-ng-if="row.canEdit && !row.parentId"
                                        data-ng-click="vm.openClassSchedule(row)" title="Thiết lập giờ học và kế hoạch theo ngày">
                                    <i class="fa fa-calendar"></i> Thiết lập lớp
                                </button>
                                <button class="btn btn-xs btn-primary" data-ng-if="row.canManageTeams"
                                        data-ng-click="vm.openTeamBoard(row)" title="Mở bảng phân đội">
                                    <i class="fa fa-random"></i> Phân đội
                                </button>
                                <button class="btn btn-xs btn-success" data-ng-if="row.canAddChild" title="Tạo đội"
                                        data-ng-click="vm.openEditor(null, row.id)"><i class="fa fa-plus"></i> Tạo đội</button>
                                <button class="btn btn-xs btn-info" data-ng-if="row.canEdit"
                                        title="Sửa thông tin / thêm trưởng phó"
                                        data-ng-click="vm.openEditor(row)">
                                    <i class="fa fa-pencil"></i> Sửa / Trưởng phó
                                </button>
                                <button class="btn btn-xs btn-danger" data-ng-if="row.canEdit"
                                        data-ng-click="vm.confirmDelete(row)"><i class="fa fa-trash"></i></button>
                            </td>
                        </tr>
                        <tr data-ng-if="!vm.visibleClasses.length">
                            <td colspan="3" class="text-center">Không có lớp phù hợp.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/ng-template" id="team_board_modal.html">
    <div class="class-management-modal team-board-modal">
        <div class="modal-header">
            <button type="button" class="close" data-ng-click="$dismiss()" aria-hidden="true"></button>
            <h4 class="modal-title"><i class="fa fa-random"></i> Phân đội — {{vm.teamBoard.className}}</h4>
        </div>
        <div class="modal-body">
            <div class="team-board-toolbar">
                <div>
                    <strong>{{vm.teamBoard.totalStudents || 0}}</strong> học sinh
                    <span class="text-muted">— kéo thả học sinh giữa các đội, thay đổi sẽ được lưu ngay.</span>
                </div>
                <div>
                    <span data-ng-if="vm.teamBoardSaving" class="text-info"><i class="fa fa-spinner fa-spin"></i> Đang lưu...</span>
                    <input type="text" class="form-control" data-ng-model="vm.teamSearchText"
                           placeholder="Tìm tên hoặc tài khoản học sinh..." />
                </div>
            </div>

            <div class="alert alert-warning" data-ng-if="!vm.teamBoard.teams.length">
                Lớp này chưa có đội. Quản trị viên hoặc quản lý giáo dục hãy bấm <strong>Tạo đội</strong> dưới lớp này trước.
            </div>

            <div class="team-board-columns">
                <section class="team-board-column" data-ng-class="{'unassigned': column.unassigned}"
                         data-ng-repeat="column in vm.teamBoard.columns track by (column.id || 'unassigned')">
                    <header class="team-board-column-header">
                        <div class="team-board-column-title">
                            <i class="fa" data-ng-class="column.unassigned ? 'fa-inbox' : 'fa-users'"></i>
                            {{column.name}}
                            <small class="team-board-column-code" data-ng-if="column.code">{{column.code}}</small>
                        </div>
                        <span class="badge">{{column.students.length}}</span>
                    </header>

                    <ul class="team-student-list" dnd-list="column.students"
                        dnd-drop="vm.dropStudent(column, item)">
                        <li class="team-student-card"
                            data-ng-repeat="student in column.students | filter:vm.teamStudentFilter track by student.id"
                            dnd-draggable="student"
                            dnd-moved="vm.removeDraggedStudent(column, student)"
                            dnd-effect-allowed="move"
                            dnd-disable-if="vm.teamBoardSaving"
                            data-ng-class="{'team-saving': vm.teamBoardSaving}">
                            <div class="team-student-name"><i class="fa fa-user"></i> {{vm.studentName(student)}}</div>
                            <div class="team-student-username">{{student.username}}</div>
                            <select class="form-control input-sm team-mobile-picker"
                                    data-ng-model="student._targetTeamId"
                                    data-ng-change="vm.moveStudentFromSelect(student)"
                                    data-ng-disabled="vm.teamBoardSaving">
                                <option data-ng-value="null">Chưa phân đội</option>
                                <option data-ng-repeat="team in vm.teamBoard.teams track by team.id"
                                        data-ng-value="team.id">{{team.name}}</option>
                            </select>
                        </li>
                        <li class="team-board-empty" data-ng-if="!(column.students | filter:vm.teamStudentFilter).length">
                            {{vm.teamSearchText ? 'Không có học sinh phù hợp' : 'Kéo học sinh vào đây'}}
                        </li>
                    </ul>
                </section>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" data-ng-click="$dismiss()" class="btn btn-default" data-ng-disabled="vm.teamBoardSaving">
                Đóng
            </button>
        </div>
    </div>
</script>

<script type="text/ng-template" id="class_schedule_modal.html">
    <div class="class-management-modal class-schedule-modal">
        <div class="modal-header">
            <h4 class="modal-title"><i class="fa fa-calendar"></i> Thiết lập lớp — {{vm.scheduleClass.name}}</h4>
            <button type="button" class="btn btn-default class-schedule-header-close" data-ng-click="$dismiss()">
                <i class="fa fa-times"></i> Đóng
            </button>
        </div>
        <div class="modal-body">
            <section class="class-schedule-time-card">
                <div class="class-schedule-time-header">
                    <div class="class-schedule-time-title">
                        <strong><i class="fa fa-clock-o"></i> Lịch học hằng tuần</strong>
                        <span>Thêm nhiều buổi; mỗi buổi có ngày và khung giờ riêng.</span>
                    </div>
                    <button type="button" class="btn btn-success class-schedule-add-session"
                            data-ng-click="vm.addWeeklySession()"
                            data-ng-disabled="vm.scheduleSaving || vm.scheduleSettingsLoading || vm.scheduleSettingsError">
                        <i class="fa fa-plus"></i> Thêm buổi học
                    </button>
                </div>

                <div class="class-schedule-settings-loading" data-ng-if="vm.scheduleSettingsLoading">
                    <i class="fa fa-spinner fa-spin"></i> Đang tải các buổi học đã thiết lập...
                </div>
                <div class="alert alert-danger" data-ng-if="vm.scheduleSettingsError">
                    Không tải được lịch học hằng tuần. Hãy đóng cửa sổ và mở lại để tránh ghi đè dữ liệu cũ.
                </div>

                <div class="class-schedule-session-list" data-ng-if="!vm.scheduleSettingsLoading && !vm.scheduleSettingsError">
                    <div class="class-schedule-session-row"
                         data-ng-repeat="session in vm.scheduleClass.weeklySessions track by $index">
                        <span class="class-schedule-session-number">{{$index + 1}}</span>
                        <div class="class-schedule-session-field session-day">
                            <label>NGÀY HỌC</label>
                            <select class="form-control" data-ng-model="session.dayOfWeek"
                                    data-ng-options="day.value as day.label for day in vm.weeklyDayOptions"
                                    data-ng-disabled="vm.scheduleSaving">
                                <option value="">Chọn ngày</option>
                            </select>
                        </div>
                        <div class="class-schedule-session-field session-start">
                            <label>GIỜ HỌC</label>
                            <input type="time" class="form-control" data-ng-model="session.startTimeValue"
                                   data-ng-disabled="vm.scheduleSaving" />
                        </div>
                        <div class="class-schedule-session-field session-end">
                            <label>GIỜ TAN HỌC</label>
                            <input type="time" class="form-control" data-ng-model="session.endTimeValue"
                                   data-ng-disabled="vm.scheduleSaving" />
                        </div>
                        <button type="button" class="btn btn-danger class-schedule-remove-session"
                                data-ng-click="vm.removeWeeklySession($index)" data-ng-disabled="vm.scheduleSaving"
                                title="Xóa buổi học"><i class="fa fa-trash"></i></button>
                    </div>
                    <div class="class-schedule-no-session" data-ng-if="!vm.scheduleClass.weeklySessions.length">
                        <i class="fa fa-calendar-plus-o"></i> Chưa có buổi học. Bấm <strong>Thêm buổi học</strong> để bắt đầu.
                    </div>
                </div>

                <div class="class-schedule-time-footer" data-ng-if="!vm.scheduleSettingsLoading && !vm.scheduleSettingsError">
                    <span class="class-schedule-session-note">
                        <i class="fa fa-info-circle"></i> Có thể thêm nhiều buổi trong cùng một ngày nếu cần.
                    </span>
                    <button type="button" class="btn btn-primary class-schedule-save-time"
                            data-ng-click="vm.saveScheduleSettings()" data-ng-disabled="vm.scheduleSaving">
                        <i class="fa" data-ng-class="vm.scheduleSaving ? 'fa-spinner fa-spin' : 'fa-save'"></i>
                        {{vm.scheduleSaving ? 'Đang lưu...' : 'Lưu lịch học'}}
                    </button>
                </div>
            </section>

            <section class="class-schedule-calendar">
                <div class="class-schedule-calendar-toolbar">
                    <button type="button" class="btn btn-default class-schedule-nav"
                            data-ng-click="vm.changeScheduleMonth(-1)" data-ng-disabled="vm.scheduleLoading">
                        <i class="fa fa-chevron-left"></i>
                    </button>
                    <div class="class-schedule-month">{{vm.scheduleMonthLabel}}</div>
                    <button type="button" class="btn btn-default class-schedule-nav"
                            data-ng-click="vm.changeScheduleMonth(1)" data-ng-disabled="vm.scheduleLoading">
                        <i class="fa fa-chevron-right"></i>
                    </button>
                </div>
                <div class="class-schedule-loading" data-ng-if="vm.scheduleLoading">
                    <i class="fa fa-spinner fa-spin"></i>
                    <div><strong>Đang tải lịch lớp...</strong>Khung giờ học phía trên vẫn có thể thao tác.</div>
                </div>
                <div class="class-schedule-grid" data-ng-if="!vm.scheduleLoading">
                    <div class="class-schedule-weekday" data-ng-repeat="weekday in vm.scheduleWeekdays track by $index">{{weekday}}</div>
                    <button type="button" class="class-schedule-day"
                            data-ng-repeat="cell in vm.scheduleCalendarDays track by $index"
                            data-ng-disabled="cell.isBlank"
                            data-ng-class="{'is-blank': cell.isBlank, 'is-today': cell.isToday, 'is-class-day': cell.isClassDay}"
                            data-ng-click="vm.openScheduleDay(cell)">
                        <span data-ng-if="!cell.isBlank">
                            <span class="class-schedule-day-number">{{cell.day}}</span>
                            <span class="class-schedule-topic-count class-count" data-ng-if="cell.classCount">
                                Class: {{cell.classCount}} topic
                            </span>
                            <span class="class-schedule-topic-count homework-count" data-ng-if="cell.homeworkCount">
                                Homework: {{cell.homeworkCount}} topic
                            </span>
                            <span class="class-schedule-empty-hint" data-ng-if="!cell.classCount && !cell.homeworkCount">
                                {{cell.isClassDay ? 'Ngày học · + Thêm bài' : '+ Thêm bài'}}
                            </span>
                        </span>
                    </button>
                </div>
            </section>
        </div>
    </div>
</script>

<script type="text/ng-template" id="class_schedule_day_modal.html">
    <div class="class-management-modal class-day-plan-modal">
        <div class="modal-header">
            <button type="button" class="close" data-ng-click="$dismiss()" aria-hidden="true"></button>
            <h4 class="modal-title"><i class="fa fa-calendar-check-o"></i> Kế hoạch ngày {{vm.scheduleDayLabel()}}</h4>
        </div>
        <div class="modal-body">
            <div class="class-day-plan-grid">
                <section class="class-day-plan-card class-plan">
                    <div class="class-day-plan-heading">
                        <h4><i class="fa fa-book"></i> Class</h4>
                        <button type="button" class="btn btn-primary class-day-add-btn"
                                data-ng-click="vm.toggleTopicSelection('classTopicIds')"
                                data-ng-disabled="vm.scheduleTopicsLoading" title="Chọn topic học trên lớp">
                            <i class="fa" data-ng-class="vm.scheduleTopicsLoading ? 'fa-spinner fa-spin' : (vm.topicSelectionOpen.classTopicIds ? 'fa-minus' : 'fa-plus')"></i>
                        </button>
                    </div>
                    <ui-select multiple theme="bootstrap" class="class-day-topic-select"
                               data-ng-if="vm.topicSelectionOpen.classTopicIds"
                               data-ng-model="vm.scheduleDay.classTopicIds" close-on-select="false">
                        <ui-select-match placeholder="Gõ tên topic để chọn...">{{$item.name}}</ui-select-match>
                        <ui-select-choices repeat="topic.id as topic in vm.scheduleTopics | propsFilter:{name:$select.search}">
                            <div data-ng-bind-html="topic.name | highlight:$select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                    <ul class="class-day-selected-list" data-ng-if="!vm.topicSelectionOpen.classTopicIds">
                        <li data-ng-repeat="topic in vm.selectedScheduleTopics('classTopicIds') track by topic.id">
                            <i class="fa fa-check-circle"></i> {{topic.name}}
                        </li>
                        <li class="class-day-empty" data-ng-if="!vm.scheduleDay.classTopicIds.length">Chưa chọn topic học trên lớp.</li>
                    </ul>
                </section>

                <section class="class-day-plan-card homework-plan">
                    <div class="class-day-plan-heading">
                        <h4><i class="fa fa-pencil-square-o"></i> Homework</h4>
                        <button type="button" class="btn btn-warning class-day-add-btn"
                                data-ng-click="vm.toggleTopicSelection('homeworkTopicIds')"
                                data-ng-disabled="vm.scheduleTopicsLoading" title="Chọn topic bài tập về nhà">
                            <i class="fa" data-ng-class="vm.scheduleTopicsLoading ? 'fa-spinner fa-spin' : (vm.topicSelectionOpen.homeworkTopicIds ? 'fa-minus' : 'fa-plus')"></i>
                        </button>
                    </div>
                    <ui-select multiple theme="bootstrap" class="class-day-topic-select"
                               data-ng-if="vm.topicSelectionOpen.homeworkTopicIds"
                               data-ng-model="vm.scheduleDay.homeworkTopicIds" close-on-select="false">
                        <ui-select-match placeholder="Gõ tên topic để chọn...">{{$item.name}}</ui-select-match>
                        <ui-select-choices repeat="topic.id as topic in vm.scheduleTopics | propsFilter:{name:$select.search}">
                            <div data-ng-bind-html="topic.name | highlight:$select.search"></div>
                        </ui-select-choices>
                    </ui-select>
                    <ul class="class-day-selected-list" data-ng-if="!vm.topicSelectionOpen.homeworkTopicIds">
                        <li data-ng-repeat="topic in vm.selectedScheduleTopics('homeworkTopicIds') track by topic.id">
                            <i class="fa fa-check-circle"></i> {{topic.name}}
                        </li>
                        <li class="class-day-empty" data-ng-if="!vm.scheduleDay.homeworkTopicIds.length">Chưa chọn topic bài tập về nhà.</li>
                    </ul>
                </section>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-default" data-ng-click="$dismiss()" data-ng-disabled="vm.scheduleDaySaving">Hủy</button>
            <button type="button" class="btn btn-primary" data-ng-click="vm.saveScheduleDay()" data-ng-disabled="vm.scheduleDaySaving">
                <i class="fa" data-ng-class="vm.scheduleDaySaving ? 'fa-spinner fa-spin' : 'fa-save'"></i>
                {{vm.scheduleDaySaving ? 'Đang lưu...' : 'Lưu kế hoạch'}}
            </button>
        </div>
    </div>
</script>

<script type="text/ng-template" id="edit_object_modal.html">
    <div class="class-management-modal" modal-movable>
        <div class="modal-header">
            <button type="button" class="close" ng-click="$dismiss()" aria-hidden="true"></button>
            <h4 class="modal-title"><i class="fa fa-sitemap"></i>
                {{vm.enrolmentClass.isNew ? 'Thêm lớp học / tổ' : 'Cập nhật lớp học / tổ'}}
            </h4>
        </div>
        <div class="modal-body">
            <div class="row">
                <div class="col-md-8 form-group">
                    <label class="bold">Tên lớp / tổ <span class="font-red">*</span></label>
                    <input data-ng-model="vm.enrolmentClass.name" type="text" class="form-control" autofocus />
                </div>
                <div class="col-md-4 form-group">
                    <label class="bold">Mã</label>
                    <input data-ng-model="vm.enrolmentClass.code" type="text" class="form-control" />
                </div>
                <div class="col-md-8 form-group">
                    <label class="bold">Thuộc lớp / tổ cha</label>
                    <ui-select data-ng-model="vm.enrolmentClass.parentId" theme="bootstrap" allow-clear="true"
                               data-ng-change="vm.parentChanged()">
						<ui-select-match placeholder="Không chọn = lớp gốc">{{$select.selected.treeLabel || $select.selected.name}}</ui-select-match>
						<ui-select-choices repeat="item.id as item in vm.availableParents() | propsFilter:{treeLabel:$select.search, name:$select.search, code:$select.search}">
							<div ng-bind-html="(item.treeLabel || item.name) | highlight:$select.search"></div>
                            <small>{{item.code}}</small>
                        </ui-select-choices>
                    </ui-select>
                </div>
                <div class="col-md-4 form-group">
                    <label class="bold">Mã trường</label>
                    <input data-ng-model="vm.enrolmentClass.schoolId" type="number" class="form-control"
                           data-ng-readonly="!vm.isAdmin()" />
                    <span class="help-block" data-ng-if="!vm.isAdmin()">
                        Mã trường được hệ thống giữ theo phạm vi bạn quản lý.
                    </span>
                </div>
                <div class="col-md-12 form-group">
                    <label class="bold">
                        {{vm.enrolmentClass.parentId ? 'Đội trưởng' : 'Phụ trách chính'}} (chọn 1)
                    </label>
                    <ui-select theme="bootstrap" data-ng-model="vm.enrolmentClass.primaryTeacherId"
                               data-ng-disabled="vm.candidatesLoading || vm.candidatesError || vm.saving"
                               on-select="vm.primaryChanged()" style="width:100%">
                        <ui-select-match allow-clear="true" placeholder="{{vm.enrolmentClass.parentId ? 'Chọn đội trưởng...' : 'Chọn phụ trách chính...'}}">
                            {{$select.selected.displayName || $select.selected.username}}
                        </ui-select-match>
                        <ui-select-choices repeat="teacher.id as teacher in vm.teacherCandidates | propsFilter:{displayName:$select.search, username:$select.search}">
                            <div>{{teacher.displayName || teacher.username}}</div>
                            <small>{{teacher.username}}</small>
                        </ui-select-choices>
                    </ui-select>
                </div>
                <div class="col-md-12 form-group">
                    <label class="bold">
                        {{vm.enrolmentClass.parentId ? 'Đội phó' : 'Phụ trách phụ'}} (có thể chọn nhiều)
                    </label>
                    <ui-select multiple theme="bootstrap" class="class-responsible-select"
                               data-ng-model="vm.enrolmentClass.deputyTeacherIds"
                               data-ng-disabled="vm.candidatesLoading || vm.candidatesError || vm.saving"
                               close-on-select="false" style="width:100%">
                        <ui-select-match placeholder="{{vm.enrolmentClass.parentId ? 'Chọn đội phó...' : 'Chọn phụ trách phụ...'}}">
                            {{$item.displayName || $item.username}}
                        </ui-select-match>
                        <ui-select-choices repeat="teacher.id as teacher in vm.deputyCandidates() | propsFilter:{displayName:$select.search, username:$select.search}">
                            <div>{{teacher.displayName || teacher.username}}</div>
                            <small>{{teacher.username}}</small>
                        </ui-select-choices>
                    </ui-select>
                    <span class="help-block" data-ng-if="!vm.enrolmentClass.parentId">
                        Lớp gốc chỉ cho phép giáo viên hoặc tài khoản quản lý phụ trách.
                    </span>
                    <span class="help-block" data-ng-if="vm.enrolmentClass.parentId">
                        Chỉ học sinh đã được phân vào tổ này mới có thể chọn làm Đội trưởng / Đội phó.
                        Học sinh được chọn không được cấp thêm quyền quản trị.
                    </span>
                    <span class="help-block" data-ng-if="vm.enrolmentClass.parentId && !vm.candidatesLoading && !vm.candidatesError && !vm.teacherCandidates.length">
                        Chưa có thành viên để chọn. Hãy lưu tổ và phân học sinh vào tổ trước.
                    </span>
                    <span class="help-block" data-ng-if="vm.candidatesLoading">Đang tải danh sách...</span>
                    <button type="button" class="btn btn-default" data-ng-if="vm.candidatesError"
                            data-ng-click="vm.parentChanged()">Tải lại danh sách</button>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" ng-click="$dismiss()" class="btn btn-default">Hủy bỏ</button>
            <button type="button" ng-click="vm.saveObject()" class="btn btn-primary" data-ng-disabled="vm.saving || vm.candidatesLoading || vm.candidatesError">
                <i class="fa fa-save"></i> {{vm.saving ? 'Đang lưu...' : 'Lưu'}}
            </button>
        </div>
    </div>
</script>

<script type="text/ng-template" id="confirm_delete_modal.html">
    <div class="class-management-modal" modal-movable>
        <div class="modal-header"><h4 class="modal-title"><i class="fa fa-warning"></i> Xóa lớp học</h4></div>
        <div class="modal-body">
            <p>Bạn có chắc muốn xóa <strong>{{vm.enrolmentClassToDelete.name}}</strong>?</p>
            <p class="text-muted">Không thể xóa nếu lớp còn đội hoặc còn học sinh.</p>
        </div>
        <div class="modal-footer">
            <button type="button" ng-click="$dismiss()" class="btn btn-default">Không</button>
            <button type="button" ng-click="$close('yes')" class="btn btn-danger">Có, xóa</button>
        </div>
    </div>
</script>
