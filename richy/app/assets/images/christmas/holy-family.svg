<svg xmlns="http://www.w3.org/2000/svg" width="460" height="220" viewBox="0 0 460 220">
  <title>The Holy Family in the stable at Bethlehem</title>
  <style>
    .starlight { animation:shine 3.2s ease-in-out infinite alternate; }
    .star-glint { animation:twinkle 3.8s ease-in-out infinite; }
    .star-glint:nth-child(2) { animation-delay:-1.5s; }
    .star-glint:nth-child(3) { animation-delay:-2.8s; }
    .star-glint:nth-child(4) { animation-delay:-.7s; }
    .lamplight { animation:shine 3.5s ease-in-out -1.7s infinite alternate; }
    @keyframes shine { from {opacity:.64} to {opacity:1} }
    @keyframes twinkle { 0%,100% {opacity:.42} 48% {opacity:1} }
    @media (prefers-reduced-motion:reduce) { .starlight,.star-glint,.lamplight {animation:none} }
  </style>
  <defs>
    <radialGradient id="night" cx=".58" cy=".48" r=".42">
      <stop stop-color="#143943"/><stop offset="1" stop-color="#143943" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starlight">
      <stop stop-color="#fff4b5" stop-opacity=".86"/><stop offset="1" stop-color="#ffe291" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amber" cx=".51" cy=".66" r=".65">
      <stop stop-color="#ad6a47"/><stop offset=".56" stop-color="#704332"/><stop offset="1" stop-color="#342b36"/>
    </radialGradient>
    <radialGradient id="lantern">
      <stop stop-color="#ffce83" stop-opacity=".7"/><stop offset="1" stop-color="#ffb966" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mountain-slope" x2="0" y2="1">
      <stop stop-color="#72a2b2" stop-opacity=".9"/>
      <stop offset=".58" stop-color="#477180" stop-opacity=".78"/>
      <stop offset="1" stop-color="#315c65" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mountain-snow" x2=".5" y2="1">
      <stop stop-color="#cbe4ea"/><stop offset="1" stop-color="#7ca5b4"/>
    </linearGradient>
    <linearGradient id="ground" x2="1" y2="0">
      <stop stop-color="#39756d" stop-opacity="0"/><stop offset=".55" stop-color="#285a55"/>
      <stop offset=".84" stop-color="#153d42"/><stop offset="1" stop-color="#153d42" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="snow-haze">
      <stop stop-color="#d3f3f4" stop-opacity=".52"/>
      <stop offset=".55" stop-color="#bee5ea" stop-opacity=".24"/>
      <stop offset="1" stop-color="#bee5ea" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snowbank">
      <stop stop-color="#c5e7ec" stop-opacity="0"/>
      <stop offset=".44" stop-color="#d6edf0" stop-opacity=".62"/>
      <stop offset="1" stop-color="#afd4da" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pine-needles" x2=".9" y2="1">
      <stop stop-color="#518879"/><stop offset="1" stop-color="#204744"/>
    </linearGradient>
    <linearGradient id="pine-snow" x2=".8" y2="1">
      <stop stop-color="#edfafa"/><stop offset="1" stop-color="#95c4ce"/>
    </linearGradient>
    <linearGradient id="robe" x2=".92" y2=".85">
      <stop stop-color="#84d2da"/><stop offset=".56" stop-color="#4299ad"/><stop offset="1" stop-color="#285f78"/>
    </linearGradient>
    <linearGradient id="mantle" x2=".9" y2="1">
      <stop stop-color="#ecac73"/><stop offset="1" stop-color="#9d5846"/>
    </linearGradient>
    <linearGradient id="wood" x2="0" y2="1">
      <stop stop-color="#c39364"/><stop offset="1" stop-color="#735242"/>
    </linearGradient>
    <g id="small-star">
      <circle r="16" fill="url(#starlight)" opacity=".68"/>
      <path d="M0-8 1.6-1.6 8 0 1.6 1.6 0 8-1.6 1.6-8 0-1.6-1.6Z" fill="#fff5cc"/>
      <circle r="1.3" fill="#fffdeb"/>
    </g>
    <g id="snowy-pine">
      <path d="M-3-15H3V0H-3Z" fill="#726154"/>
      <path d="M0-86c-5 12-10 19-17 26l9-1c-6 11-12 18-18 23l10-2c-5 10-11 17-18 22 12 5 23 4 34 2 11 2 22 3 34-2-7-5-13-12-18-22l10 2c-6-5-12-12-18-23l9 1C10-67 5-74 0-86Z" fill="url(#pine-needles)"/>
      <path d="M0-86c-5 12-10 19-17 26 7-1 12-5 17-4 6-1 10 3 17 4C10-67 5-74 0-86Zm-14 34c-4 6-8 11-12 14 7 1 13-5 18-5l8 2 9-2c6 1 9 6 17 5-4-3-8-8-12-14-4 3-9 4-14 4s-10-1-14-4Zm-8 22c-4 5-8 9-12 12 8 4 15-1 22-2l12 2 12-2c7 1 14 6 22 2-4-3-8-7-12-12-8 4-15 5-22 4-7 1-14 0-22-4Z" fill="url(#pine-snow)"/>
    </g>
  </defs>

  <!-- A transparent edge lets the scene meet the banner's teal gradient. -->
  <path d="M0 0H460V220H0Z" fill="url(#night)"/>
  <!-- Distant snowy ridges fade into the hills behind the stable. -->
  <g id="snowy-mountains">
    <path d="M35 173 79 114l32 23 39-36 41 28 22-25 47 42 26-17 23 9 28-34 30 20 29-25 59 67v20H35Z" fill="url(#mountain-slope)" opacity=".42"/>
    <g fill="url(#mountain-slope)">
      <path d="M20 174 58 127l20 10 47-59 19 18 17 25 14-8 44 45 26 26H20Z"/>
      <path d="M238 180l60-51 18 6 53-69 17 19 19 29 16-16 27 31 10 37v15Z"/>
    </g>
    <g fill="url(#mountain-snow)" opacity=".83">
      <path d="m97 113 28-35 19 18 10 15-12-6-8 4-10-10-10 11-8-3Z"/>
      <path d="m343 100 26-34 17 19 14 22-12-5-7 3-12-11-9 8-7-4Zm67 9 11-11 13 15-8-3-5 4-6-3Z"/>
    </g>
    <path d="m125 99 8 17 28 21m208-43 11 19 26 26" fill="none" stroke="#bbd9e1" stroke-opacity=".26" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <g fill="#e6faf5" opacity=".64">
    <circle cx="120" cy="37" r="1.4"/><circle cx="148" cy="19" r="1"/>
    <circle cx="179" cy="48" r="1.4"/><circle cx="204" cy="23" r="1.1"/>
    <circle cx="302" cy="29" r="1.2"/><circle cx="325" cy="15" r="1.3"/>
    <circle cx="355" cy="46" r="1.2"/><circle cx="400" cy="23" r="1.3"/>
    <circle cx="436" cy="47" r="1.6"/><circle cx="412" cy="66" r="1"/>
  </g>
  <g class="starlight" fill="#fff5c8">
    <circle cx="250" cy="27" r="37" fill="url(#starlight)"/>
    <path d="M250 4l3 19 18 4-18 3-3 20-3-20-18-3 18-4Z"/>
    <path d="m240 17 10 7 10-7-7 10 7 10-10-7-10 7 7-10Z" opacity=".78"/>
    <circle cx="250" cy="27" r="3.4" fill="#fffdeb"/>
  </g>
  <g>
    <use class="star-glint" href="#small-star" transform="translate(142 49) scale(.44)"/>
    <use class="star-glint" href="#small-star" transform="translate(186 31) scale(.62)"/>
    <use class="star-glint" href="#small-star" transform="translate(332 48) scale(.61)"/>
    <use class="star-glint" href="#small-star" transform="translate(389 39) scale(.49)"/>
  </g>
  <path d="M25 190q61-39 125-28 51 8 94-1 72-33 124-15 49-29 92-12v86H25Z" fill="url(#ground)" opacity=".65"/>
  <path d="M16 213q78-31 144-30 47-20 107-11 50 6 94 3 63-13 99-3v48H0Z" fill="url(#ground)"/>
  <path d="M67 204q61-15 106-13 50-19 104-14 50 7 87 5 45-8 96-5" fill="none" stroke="#96c2ac" stroke-opacity=".24" stroke-width="1.5"/>

  <!-- Snow and low mist frame the stable in cool tones. -->
  <ellipse cx="100" cy="163" rx="93" ry="37" fill="url(#snow-haze)" opacity=".65"/>
  <ellipse cx="396" cy="163" rx="64" ry="34" fill="url(#snow-haze)" opacity=".68"/>
  <use href="#snowy-pine" transform="translate(63 187) scale(.61)" opacity=".62"/>
  <use href="#snowy-pine" transform="translate(104 184) scale(.95)"/>
  <use href="#snowy-pine" transform="translate(394 188) scale(.78)"/>
  <path d="M36 198q32-15 69-14 19-4 45-1 12-1 20 3-33 5-65 9-34 7-69 3Z" fill="url(#snowbank)"/>
  <path d="M340 194q23-11 52-8 24-7 51-3l13 3q-53 16-116 8Z" fill="url(#snowbank)"/>
  <ellipse cx="237" cy="198" rx="170" ry="17" fill="url(#snow-haze)" opacity=".58"/>
  <g fill="#d9f4f5" opacity=".62">
    <circle cx="75" cy="102" r="1.5"/><circle cx="118" cy="87" r="1.5"/>
    <circle cx="133" cy="128" r="1.2"/><circle cx="53" cy="150" r="1.3"/>
    <circle cx="375" cy="109" r="1.4"/><circle cx="417" cy="119" r="1.5"/>
    <circle cx="434" cy="153" r="1.2"/>
  </g>

  <!-- Open timber stable, warm interior and hay. -->
  <path d="M147 107 250 55l105 52v66H147Z" fill="url(#amber)"/>
  <path d="M164 108h174m-174 15h174m-174 15h174m-174 15h174" fill="none" stroke="#301f26" stroke-opacity=".24" stroke-width="2"/>
  <path d="M139 109 250 49l112 60-9 8-103-54-103 54Z" fill="#52382f" stroke="#b98456" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M141 108 250 49l112 60m-193-14 81-44 82 44" fill="none" stroke="#e8bb7e" stroke-opacity=".68" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M155 112v62m190-62v62" fill="none" stroke="#472f2f" stroke-width="13"/>
  <path d="M151 111v61m191-61v62" fill="none" stroke="url(#wood)" stroke-width="4" stroke-linecap="round"/>
  <path d="m155 129 19-24m171 24-19-24" fill="none" stroke="#9b7154" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="250" cy="167" rx="100" ry="14" fill="#d49c63" opacity=".32"/>
  <path d="m162 171 18-5m-13 9 20-5m119 3 26-5m-18 9 18-2" fill="none" stroke="#e3b478" stroke-width="1.5" stroke-linecap="round" opacity=".76"/>
  <g class="lamplight">
    <circle cx="325" cy="117" r="23" fill="url(#lantern)"/>
    <path d="M325 102v9" stroke="#d5ac76" stroke-width="1.5"/>
    <rect x="320" y="110" width="10" height="13" rx="2" fill="#ffda8f" stroke="#82553d" stroke-width="2"/>
    <path d="M325 113v7" stroke="#fff2be" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Mary, Joseph, and the infant Jesus in the manger. -->
  <g>
    <ellipse cx="249" cy="144" rx="69" ry="43" fill="url(#lantern)" opacity=".75"/>
    <circle cx="208" cy="105" r="16" fill="none" stroke="#f6d493" stroke-width="1.4" opacity=".7"/>
    <path d="M207 108c-13 2-25 15-28 37l-9 15c14 5 39 6 57-1l-9-16 5-15Z" fill="url(#robe)" stroke="#22596b" stroke-width="1.6"/>
    <path d="M210 91c-11-2-19 7-21 18l-7 22 11-3 9-14 15 4 6-7c-2-9-5-18-13-20Z" fill="#cce9e2"/>
    <path d="M207 97c5-2 11 1 13 7l-2 4 4 3-4 2c-3 7-11 6-15 1-3-5-2-13 4-17Z" fill="#f3be8d"/>
    <path d="M201 109c1-9 9-15 16-11-3-4-7-6-12-4-6 2-9 9-8 17Z" fill="#e2f4eb"/>
    <path d="m214 107 3 1" stroke="#855441" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M194 134c7 5 17 10 29 8l4-3-8-3-13-8" fill="#72becb" stroke="#388097" stroke-width="1.2"/>
    <path d="m221 138 8-4 4 3-7 5" fill="#f3be8d"/>
    <path d="M189 145q-3 9-10 13m20-16q-2 10-5 17" fill="none" stroke="#abe2e3" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round"/>

    <circle cx="288" cy="101" r="17" fill="none" stroke="#f6d493" stroke-width="1.4" opacity=".7"/>
    <path d="M288 106c13-2 23 8 29 28l7 25q-24 7-53 0l-5-25Z" fill="url(#mantle)" stroke="#855046" stroke-width="1.6"/>
    <path d="M289 115c6 11 5 24 4 46h-19l-5-19 6-20Z" fill="#75545f"/>
    <path d="M289 87c-9-1-14 6-15 16l-4 5 4 2c2 6 6 10 13 6 4-2 8-8 10-13l-1-9Z" fill="#efb588"/>
    <path d="M284 87c7-4 18 1 19 11l2 16-9-4-5-14-15 2 2-8Z" fill="#e1bd8e"/>
    <path d="M275 111q9 2 15-5l-2 8-6 6-6-3Z" fill="#72483f"/>
    <path d="m276 104 3-1" stroke="#82513e" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M300 124q-13 12-29 13l-4 6q20 5 37-8" fill="#dd9b6e" stroke="#aa6953" stroke-width="1.2"/>
    <path d="m273 137-8-3-6 3 4 4 8 1" fill="#efb588"/>
    <path d="M310 153l-5-14m-5 17-1-13" fill="none" stroke="#f1c899" stroke-opacity=".64" stroke-width="1.6" stroke-linecap="round"/>

    <circle cx="246" cy="130" r="20" fill="url(#starlight)" opacity=".82"/>
    <circle cx="246" cy="130" r="9" fill="none" stroke="#ffe8a2" stroke-width="1.25"/>
    <path d="M226 147q8-11 23-11 13-5 23 9l-11 10-24 1Z" fill="#d5ae6e"/>
    <path d="M244 135q-9 0-12 9 13 7 28-1-3-8-9-8Z" fill="#fff2d3" stroke="#e2c79c" stroke-width="1.2"/>
    <path d="m238 138 12 7m-6-9 12 7" stroke="#d8bf9e" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="246" cy="131" r="5.8" fill="#ffd6a8"/>
    <path d="M242 131q1 2 3 1" fill="none" stroke="#98654f" stroke-width=".9" stroke-linecap="round"/>
    <path d="M224 146h49l-7 12h-35Z" fill="url(#wood)" stroke="#764d38" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M230 151h38m-30 7-7 9m28-9 7 9" fill="none" stroke="#e0b37d" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- The donkey and a small sheep frame the family. -->
  <g>
    <path d="M329 154c4-9 15-13 23-10 6 2 8 7 7 14l-5 5h-20Z" fill="#847b7b"/>
    <path d="M340 159v8m13-8v8" stroke="#645d66" stroke-width="3" stroke-linecap="round"/>
    <path d="M338 148c-8 6-14 4-17-1-1-4 3-7 8-8l6-4 4 4Z" fill="#a49a95"/>
    <path d="M332 139q-7-7-5-14 5 0 8 12m1 0q1-10 5-11 3 6-2 13" fill="#a49a95" stroke="#645d66" stroke-width="1.3" stroke-linecap="round"/>
    <ellipse cx="324" cy="146" rx="4" ry="2.6" fill="#cbb4a5"/><circle cx="332" cy="142" r="1.1" fill="#3d333c"/>
    <path d="M358 153q5 3 5 8" fill="none" stroke="#645d66" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M157 172v6m10-6v6" stroke="#8c867a" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M147 169c-1-4 2-7 5-7 0-4 6-5 9-3 4-3 10-1 11 3 6 0 7 6 4 9-5 4-24 5-29-2Z" fill="#dfddd0"/>
    <path d="M168 163q2-6 8-4l3 4q-2 6-8 6Z" fill="#b6a793"/><circle cx="175" cy="162" r=".9" fill="#544747"/>
  </g>
  <path d="M101 191q72-13 126-10m43-1q66 9 142-6m-273 29q32-7 69-7" fill="none" stroke="#a9c2a8" stroke-opacity=".26" stroke-width="1.5" stroke-linecap="round"/>
</svg>
