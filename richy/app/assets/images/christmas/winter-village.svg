<svg xmlns="http://www.w3.org/2000/svg" width="460" height="240" viewBox="0 0 460 240">
  <style>
    .window-lights { animation:warm-lights 4.6s ease-in-out infinite alternate; }
    .roof-lights { animation:warm-lights 3.8s ease-in-out -1.8s infinite alternate; }
    .tree-star { animation:star-light 3.6s ease-in-out infinite alternate; }
    .star-glints { animation:star-glints 4.1s ease-in-out infinite; }
    .tree-lights { animation:tree-lights 3.6s ease-in-out infinite alternate; }
    .tree-lights-cool { animation-delay:-2s; }
    .banner-snow { animation:local-snow 8s linear infinite; }
    @keyframes warm-lights { from {opacity:.55} to {opacity:1} }
    @keyframes star-light { from {opacity:.72} to {opacity:1} }
    @keyframes star-glints { 0%,20%,80%,100% {opacity:.1} 50% {opacity:1} }
    @keyframes tree-lights { from {opacity:.35} to {opacity:1} }
    @keyframes local-snow { from {transform:translateY(-8px);opacity:.25} 35% {opacity:.7} to {transform:translateY(29px);opacity:.2} }
    @media(prefers-reduced-motion:reduce) { .window-lights,.roof-lights,.tree-star,.star-glints,.tree-lights,.banner-snow {animation:none} }
  </style>
  <defs>
    <linearGradient id="snow" x2="0" y2="1"><stop stop-color="#f2fbff"/><stop offset="1" stop-color="#a9d3de"/></linearGradient>
    <linearGradient id="fir" x2="1" y2="1"><stop stop-color="#458e7b"/><stop offset="1" stop-color="#143d40"/></linearGradient>
