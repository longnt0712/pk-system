  <style>
    .window-lights { animation:warm-lights 4.6s ease-in-out infinite alternate; }
    .roof-lights { animation:warm-lights 3.8s ease-in-out -1.8s infinite alternate; }
    .tree-star { animation:star-light 5s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center; }
    .banner-snow { animation:local-snow 11s linear infinite; }
    @keyframes warm-lights { from {opacity:.55} to {opacity:1} }
    @keyframes star-light { from {opacity:.65} to {opacity:1} }
    @keyframes local-snow { from {transform:translateY(-8px);opacity:.25} 35% {opacity:.7} to {transform:translateY(29px);opacity:.2} }
    @media(prefers-reduced-motion:reduce) { .window-lights,.roof-lights,.tree-star,.banner-snow {animation:none} }
  </style>
