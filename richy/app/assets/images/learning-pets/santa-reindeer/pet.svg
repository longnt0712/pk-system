<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340" role="img" aria-labelledby="title desc">
  <title id="title">Ông già Noel cưỡi tuần lộc</title>
  <desc id="desc">Ông già Noel ngồi trên xe trượt tuyết đỏ do tuần lộc kéo, lướt nhẹ giữa những vệt sáng và sao lấp lánh.</desc>
  <defs>
    <linearGradient id="sleigh" x2=".5" y2="1"><stop stop-color="#ff7b79"/><stop offset=".48" stop-color="#df3456"/><stop offset="1" stop-color="#9b2149"/></linearGradient>
    <linearGradient id="coat" x2="1" y2="1"><stop stop-color="#ff6969"/><stop offset="1" stop-color="#bf2849"/></linearGradient>
    <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#fff3b5"/><stop offset=".5" stop-color="#edc565"/><stop offset="1" stop-color="#c8862b"/></linearGradient>
    <linearGradient id="fur" x2=".8" y2="1"><stop stop-color="#f9c78d"/><stop offset=".55" stop-color="#c58a59"/><stop offset="1" stop-color="#9a5b3f"/></linearGradient>
    <linearGradient id="snow" x2=".4" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#d8e8ed"/></linearGradient>
    <radialGradient id="nose"><stop stop-color="#ffd0a4"/><stop offset=".4" stop-color="#ff7d77"/><stop offset="1" stop-color="#de4555"/></radialGradient>
    <linearGradient id="trail"><stop stop-color="#91d5ec" stop-opacity="0"/><stop offset=".6" stop-color="#b5e8ff" stop-opacity=".8"/><stop offset="1" stop-color="#fff5cf"/></linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="3"/></filter>
    <g id="spark"><path d="M0-6 1.8-1.8 6 0 1.8 1.8 0 6-1.8 1.8-6 0-1.8-1.8Z" fill="#fff0b1"/><circle r="1.2" fill="#fff"/></g>
  </defs>
  <style>
    .flight { animation: sky-glide 5.4s ease-in-out infinite; transform-origin:260px 180px; }
    .sky-trail { animation: passing-stars 3.4s linear infinite; }
    .sky-trail.late { animation-delay:-1.7s; }
    .twinkle { animation: twinkle 3.6s ease-in-out infinite; }
    .twinkle.late { animation-delay:-1.8s; }
    .front-leg { animation: gallop-front 2.8s ease-in-out infinite; transform-origin:397px 190px; }
    .back-leg { animation: gallop-back 2.8s ease-in-out infinite; transform-origin:350px 196px; }
    @keyframes sky-glide { 0%,100% { transform:translate(0,3px) rotate(1deg); } 50% { transform:translate(3px,-4px) rotate(-1deg); } }
    @keyframes passing-stars { 0% { transform:translate(25px,-5px); opacity:0; } 20%,60% { opacity:.8; } 100% { transform:translate(-24px,5px); opacity:0; } }
    @keyframes twinkle { 0%,100% { opacity:.3; } 50% { opacity:1; } }
    @keyframes gallop-front { 0%,100% { transform:rotate(-7deg); } 50% { transform:rotate(7deg); } }
    @keyframes gallop-back { 0%,100% { transform:rotate(7deg); } 50% { transform:rotate(-7deg); } }
    @media (prefers-reduced-motion:reduce) { .flight,.sky-trail,.twinkle,.front-leg,.back-leg { animation:none; } .sky-trail { opacity:.6; } }
  </style>
  <g fill="none" stroke="url(#trail)" stroke-linecap="round">
    <path d="M26 259q86 24 172-1" stroke-width="3" opacity=".5"/>
    <path d="M40 278q110 24 215-12" stroke-width="2" opacity=".4"/>
  </g>
