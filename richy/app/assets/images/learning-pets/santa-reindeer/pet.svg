  </g>
  <g class="sky-trail late" fill="none" stroke="url(#trail)" stroke-linecap="round" stroke-width="2">
    <path d="M53 119h35m161-35h30m157 184h28m-97-29h18"/>
  </g>
  <g class="twinkle"><use href="#spark" x="36" y="210"/><use href="#spark" x="275" y="276"/><use href="#spark" x="458" y="182"/></g>
  <g class="twinkle late"><use href="#spark" x="77" y="283"/><use href="#spark" x="276" y="104"/><use href="#spark" x="484" y="222"/></g>
