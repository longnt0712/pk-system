<svg xmlns="http://www.w3.org/2000/svg" width="320" height="340" viewBox="0 0 320 340" role="img" aria-labelledby="title desc">
  <title id="title">Aragonda</title>
  <desc id="desc">A friendly olive-green snake with dark spots, a golden eye and a little forked tongue.</desc>
  <defs>
    <linearGradient id="coil" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#9da94f"/>
      <stop offset="1" stop-color="#7e8b3c"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#94a248"/>
      <stop offset="1" stop-color="#7e8e3a"/>
    </linearGradient>
    <clipPath id="lower-clip"><path d="M51 217C19 217 9 242 12 271C14 297 34 310 69 310H246C279 310 297 297 298 271C300 244 287 223 260 218Z"/></clipPath>
    <clipPath id="middle-clip"><path d="M76 163C48 163 34 185 35 213C35 242 55 254 85 254H226C259 254 277 240 277 214C277 185 261 165 236 164Z"/></clipPath>
    <clipPath id="upper-clip"><path d="M104 135C79 135 65 153 66 176C67 200 83 213 108 213H208C235 213 247 198 244 176C240 152 226 137 204 136Z"/></clipPath>
    <clipPath id="neck-clip"><path d="M91 162V103C91 62 119 39 162 39C187 39 208 44 218 58L223 73L257 84Q265 87 261 96Q258 103 246 103H174V122H195C219 122 232 135 230 153C229 172 213 181 192 181H113Q91 181 91 162Z"/></clipPath>
  </defs>
  <style>
    .aragonda-tongue { transform-origin: 254px 98px; transform: scaleX(0); opacity: 0; animation: aragonda-tongue 4.8s ease-in-out infinite; }
    @keyframes aragonda-tongue {
      0%, 68%, 87%, 100% { transform: scaleX(0); opacity: 0; }
      70%, 77%, 82% { transform: scaleX(1); opacity: 1; }
      74%, 80% { transform: scaleX(.4); opacity: 1; }
      85% { transform: scaleX(.75); opacity: 1; }
    }
    .aragonda-eye { transform-origin: 193px 64px; animation: aragonda-blink 7.4s ease-in-out infinite; }
    @keyframes aragonda-blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } }
    @media (prefers-reduced-motion: reduce) {
      .aragonda-tongue { animation: none; opacity: 0; transform: scaleX(0); }
      .aragonda-eye { animation: none; }
    }
  </style>
