<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Bí ngô Halloween</title>
  <desc id="desc">Một quả bí ngô cam tròn với cuống xanh uốn cong, lá nhỏ và gương mặt đèn lồng vàng ấm đang cười.</desc>
  <defs>
