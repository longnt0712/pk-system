      <stop stop-color="#ffca49"/>
      <stop offset=".38" stop-color="#ff962c"/>
      <stop offset=".74" stop-color="#ed6417"/>
      <stop offset="1" stop-color="#c5460d"/>
    </radialGradient>
    <linearGradient id="rib-light" x1="0" y1="0" x2="1" y2=".7">
      <stop stop-color="#ffdc70" stop-opacity=".72"/>
      <stop offset=".65" stop-color="#ffb040" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ff9e28" stop-opacity="0"/>
