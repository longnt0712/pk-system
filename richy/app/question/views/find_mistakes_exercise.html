<section class="find-mistakes-exercise actual-test-font-global">
    <span class="find-mistakes-anchor" ng-repeat="question in $ctrl.pack.subQuestions track by question.ordinalNumber"
          id="question-number-{{question.ordinalNumber}}"></span>
    <p class="find-mistakes-progress" aria-live="polite">Đã lưu {{$ctrl.count()}} / {{$ctrl.pack.subQuestions.length}} vị trí cần sửa</p>
    <div class="find-mistakes-passage"><span ng-repeat="part in $ctrl.passage.parts track by $index"><span ng-if="!part.id" ng-bind="part.text"></span><button
            ng-if="part.id" type="button" class="find-mistakes-word" data-candidate="{{part.id}}"
            ng-class="{'is-active': $ctrl.active.candidate === part, 'is-saved': $ctrl.savedAt(part) >= 0}"
            aria-pressed="{{$ctrl.savedAt(part) >= 0 || $ctrl.active.candidate === part}}"
            ng-disabled="$ctrl.locked || $ctrl.editorState.pack || ($ctrl.savedAt(part) < 0 && $ctrl.count() >= $ctrl.pack.subQuestions.length)"
            ng-click="$ctrl.select(part)" ng-bind="part.text"></button></span></div>
    <p class="text-muted" ng-if="!$ctrl.active && $ctrl.count() >= $ctrl.pack.subQuestions.length">Bấm vào vị trí đã lưu để sửa lại hoặc bỏ chọn.</p>
    <p class="text-muted" ng-if="$ctrl.editorState.pack && !$ctrl.active">Lưu hoặc hủy ô đang sửa để chọn vị trí tiếp theo.</p>
    <ng-form class="find-mistakes-correction" ng-if="$ctrl.active" ng-keydown="$event.key === 'Escape' && $ctrl.close()">
        <label>
            Sửa «{{$ctrl.active.candidate.text}}»
            <textarea class="form-control" rows="2" maxlength="200" autocomplete="off" autocorrect="off"
                      spellcheck="false" ng-model="$ctrl.active.text" ng-disabled="$ctrl.locked"></textarea>
        </label>
        <div class="find-mistakes-actions">
            <button type="button" class="btn btn-primary" ng-disabled="$ctrl.locked || !$ctrl.active.text.trim()"
                    ng-click="$ctrl.save(false)">Lưu và chọn tiếp</button>
            <button type="button" class="btn btn-default" ng-click="$ctrl.close()">Hủy</button>
            <button type="button" class="btn btn-default" ng-if="$ctrl.active.saved"
                    ng-disabled="$ctrl.locked" ng-click="$ctrl.save(true)">Bỏ chọn vị trí này</button>
        </div>
    </ng-form>
</section>
