<div class="battle-online-match-controls" ng-if="vm.isHost() && vm.room.status === 'PLAYING'" aria-label="Điều khiển thời gian trận đấu">
  <div class="battle-online-match-time-actions">
    <button type="button" class="btn btn-default" ng-click="$event.stopPropagation(); vm.extendMatchTime()"
            ng-disabled="vm.matchControlBusy || !vm.canExtendMatchTime()">{{vm.room.giftOpening || (vm.isCountdownMode() && !vm.room.videoSynchronized) ? '+1 phút' : '+10 giây'}}</button>
    <button type="button" class="btn btn-danger" ng-click="$event.stopPropagation(); vm.finishMatch()"
            ng-disabled="vm.matchControlBusy">{{vm.room.giftOpening ? 'Kết thúc bóc trứng' : 'Kết thúc'}}</button>
    <button type="button" class="btn btn-default battle-online-auto-read" role="switch" aria-label="Tự đọc"
            ng-attr-aria-checked="{{vm.autoReadEnabled}}" ng-class="{'is-enabled': vm.autoReadEnabled}"
            ng-click="$event.stopPropagation(); vm.toggleAutoRead()">
        <span class="battle-online-auto-read-track" aria-hidden="true"></span><span>Tự đọc<span class="battle-online-auto-read-state">: {{vm.autoReadEnabled ? 'Bật' : 'Tắt'}}</span></span>
    </button>
  </div>
  <div class="battle-online-classic-advance-controls" ng-if="vm.isClassicMode()">
    <button type="button" class="btn btn-default battle-online-auto-read" role="switch" aria-label="Auto chuyển câu"
            ng-attr-aria-checked="{{vm.isClassicAuto()}}" ng-class="{'is-enabled': vm.isClassicAuto()}"
            ng-disabled="vm.matchControlBusy" ng-click="$event.stopPropagation(); vm.toggleClassicAuto()">
        <span class="battle-online-auto-read-track" aria-hidden="true"></span><span>Auto</span>
    </button>
    <button type="button" class="btn btn-primary" ng-if="!vm.isClassicAuto()" ng-disabled="vm.matchControlBusy || !vm.room.classicAnswerRevealed"
            ng-click="$event.stopPropagation(); vm.nextClassicQuestion()">Next câu</button>
  </div>
</div>
