<section class="test-folder-explorer" ng-class="['is-' + viewMode, {'is-dragging-test': draggingTest, 'is-moving-test': moving}]" aria-busy="{{moving || loading}}">
    <div class="test-explorer-toolbar">
        <button type="button" class="test-explorer-up" test-folder-drop="current ? current.parentId : null" ng-click="goUp()" ng-disabled="folderId == null || loading" aria-label="Lên folder cha" title="Lên folder cha"><i class="fa fa-arrow-up"></i></button>
        <nav class="test-explorer-path" aria-label="Đường dẫn folder">
            <button type="button" test-folder-drop="null" ng-click="openFolder(null)" ng-class="{'is-current': folderId == null}"><i class="fa fa-home"></i> {{allTeachers ? 'Thư viện' : 'Folder của tôi'}}</button>
            <span class="test-explorer-owner" ng-if="allTeachers && current"><i class="fa fa-angle-right"></i> {{current.ownerName}}</span>
            <span ng-repeat="folder in breadcrumbs track by folder.id"><i class="fa fa-angle-right"></i><button type="button" test-folder-drop="folder.id" ng-click="openFolder(folder.id)" ng-class="{'is-current': folder.id == folderId}">{{folder.name}}</button></span>
        </nav>
        <button type="button" class="test-explorer-view" ng-click="toggleView()" aria-label="{{viewMode === 'grid' ? 'Chuyển sang dạng danh sách' : 'Chuyển sang dạng biểu tượng'}}" title="{{viewMode === 'grid' ? 'Dạng danh sách' : 'Dạng biểu tượng'}}"><i class="fa" ng-class="viewMode === 'grid' ? 'fa-list' : 'fa-th-large'"></i><span>{{viewMode === 'grid' ? 'Danh sách' : 'Biểu tượng'}}</span></button>
    </div>
    <div class="test-explorer-actions" ng-if="manage">
        <button type="button" class="btn btn-default btn-sm" ng-click="create()" ng-disabled="loading || saving"><i class="fa fa-folder" aria-hidden="true"></i> {{current ? 'Tạo folder con' : 'Tạo folder'}}</button>
        <button type="button" class="btn btn-default btn-sm" ng-if="current.canManage" ng-click="rename()" ng-disabled="saving">Đổi tên folder</button>
        <span class="test-explorer-drag-help">Kéo bài hoặc folder vào folder khác. Folder con và bài bên trong sẽ đi cùng.</span>
    </div>
    <div class="test-explorer-selection" ng-if="manage && files.length">
        <button type="button" class="btn btn-default btn-sm" ng-click="selectAllFiles()" ng-disabled="moving || moveDisabled">Chọn tất cả trên trang</button>
        <span aria-live="polite">Đã chọn {{selectedCount()}} bài</span>
        <button type="button" class="btn btn-primary btn-sm" ng-click="moveSelected()" ng-disabled="!selectedCount() || moving || moveDisabled"><i class="fa fa-folder-open-o" aria-hidden="true"></i> Di chuyển đã chọn</button>
        <button type="button" class="btn btn-link btn-sm" ng-click="clearSelection()" ng-if="selectedCount()" ng-disabled="moving">Bỏ chọn</button>
    </div>
    <p class="test-explorer-move-status" ng-if="moving || moveMessage" role="status" aria-live="polite"><i class="fa fa-spinner fa-spin" ng-if="moving" aria-hidden="true"></i> {{moving ? 'Đang chuyển bài...' : moveMessage}}</p>
    <p class="test-folder-error" ng-if="moveError" role="alert">{{moveError}}</p>
    <p class="test-folder-error" ng-if="error" role="alert">{{error}} <button type="button" class="btn btn-link btn-sm" ng-click="reload(true)">Thử lại</button></p>
    <div class="test-folder-editor" ng-if="editor">
        <label>Tên folder<input type="text" class="form-control" maxlength="200" ng-model="editor.name" aria-label="Tên folder"></label>
        <button type="button" class="btn btn-primary btn-sm" ng-click="save()" ng-disabled="saving || !editor.name.trim()">{{saving ? 'Đang lưu...' : 'Lưu folder'}}</button>
        <button type="button" class="btn btn-default btn-sm" ng-click="cancelEditor()" ng-disabled="saving">Hủy</button>
    </div>
    <p ng-if="loading" role="status">Đang tải folder...</p>
    <div class="test-explorer-items">
        <div class="test-explorer-folder-entry" test-folder-container-drag="folder" test-folder-drop="folder.id" ng-repeat="folder in children track by folder.id">
        <button type="button" class="test-explorer-folder" ng-if="!renamingFolder || renamingFolder.id != folder.id" test-folder-open="openFolder(folder.id)" ng-keydown="$event.key === 'F2' && startRenameFolder(folder, $event)" title="Mở folder {{folder.name}}">
            <span class="test-explorer-folder-icon" aria-hidden="true">
                <i class="fa fa-folder"></i>
                <span class="library-folder-apps" ng-if="allTeachers && !manage">
                    <i class="fa fa-file-text"></i><i class="fa fa-headphones"></i><i class="fa fa-pencil"></i>
                    <i class="fa fa-book"></i><i class="fa fa-list-ul"></i><i class="fa fa-play"></i>
                    <i class="fa fa-bookmark"></i><i class="fa fa-check"></i><i class="fa fa-graduation-cap"></i>
                </span>
            </span>
            <span class="test-explorer-name" ng-dblclick="startRenameFolder(folder, $event)" title="{{manage && folder.canManage ? 'Nhấp đúp để đổi tên folder' : folder.name}}">{{folder.name}}<small ng-if="allTeachers && folderId == null">{{folder.ownerName}}</small></span>
            <i class="fa fa-angle-right test-explorer-folder-arrow" aria-hidden="true"></i>
        </button>
        <div class="test-explorer-folder-actions" ng-if="manage && folder.canManage && (!renamingFolder || renamingFolder.id != folder.id)">
            <button type="button" class="test-explorer-action--move" ng-click="moveFolder(folder, $event)" ng-disabled="loading || saving || moving || moveDisabled || folderMoveDialogOpen || editor || renamingFolder" aria-label="Di chuyển folder {{folder.name}}"><i class="fa fa-folder-open-o" aria-hidden="true"></i> Di chuyển</button>
        </div>
        <div class="test-explorer-folder-rename" ng-if="renamingFolder.id == folder.id">
            <span class="test-explorer-folder-icon" aria-hidden="true"><i class="fa fa-folder"></i></span>
            <input type="text" class="form-control" maxlength="200" ng-model="renamingFolder.name" ng-keydown="renameFolderKey($event)" ng-disabled="renamingFolderSaving" aria-label="Tên folder mới">
            <div class="test-title-editor-actions">
                <button type="button" class="btn btn-primary btn-sm" ng-click="saveRenamedFolder()" ng-disabled="renamingFolderSaving">{{renamingFolderSaving ? 'Đang lưu...' : 'Lưu tên'}}</button>
                <button type="button" class="btn btn-default btn-sm" ng-click="cancelRenameFolder()" ng-disabled="renamingFolderSaving">Hủy</button>
            </div>
            <small class="test-title-editor-hint">Enter để lưu · Esc để hủy</small>
            <p class="test-folder-error" role="alert" ng-if="renameFolderError">{{renameFolderError}}</p>
        </div>
        </div>
        <div class="test-explorer-files" ng-transclude></div>
    </div>
</section>
